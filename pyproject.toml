[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ml"
version = "0.1.0"
description = "Multi-agent ML platform: research, data discovery, model building, and optimization across AI providers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Yaseen Shady", email = "yaseenshady7@gmail.com" }]
keywords = ["machine-learning", "agents", "multi-agent", "llm", "automl", "data-discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "datasets>=3.0.0",
    "scikit-learn>=1.5.0",
    "optuna>=3.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
torch = ["torch>=2.3.0", "transformers>=4.44.0"]
kaggle = ["kaggle>=1.6.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
forge = "forge_ml.cli:app"

[project.urls]
Homepage = "https://github.com/yshady/forge-ml"
Repository = "https://github.com/yshady/forge-ml"
Issues = "https://github.com/yshady/forge-ml/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
